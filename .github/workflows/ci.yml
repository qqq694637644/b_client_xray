name: CI

on:
  push:
    branches:
      - main
      - 'gpt/**'
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall app

      - name: Test
        run: pytest

  portal-smoke:
    name: Xray v26.3.27 Portal smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout client
        uses: actions/checkout@v4

      - name: Checkout pinned Xray-core
        uses: actions/checkout@v4
        with:
          repository: qqq694637644/Xray-core
          ref: d2758a023cd7f4174a5a5fa4ff66e487d4342ba0
          path: .build/xray-core-v26.3.27

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Go for pinned Xray
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build pinned Xray
        run: |
          cd .build/xray-core-v26.3.27
          go build -trimpath -o "$RUNNER_TEMP/xray-v26.3.27" ./main

      - name: Run TCP/UDP Portal smoke
        run: python scripts/smoke_portal.py --xray "$RUNNER_TEMP/xray-v26.3.27"
