name: CI

on:
  push:
    branches:
      - main
      - 'gpt/**'
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall app

      - name: Test
        run: pytest
